# Identificação do projeto no SonarQube Cloud.
# Estes valores devem corresponder ao projeto criado a partir de raulgdias/raiz-store.
sonar.organization=raulgdias
sonar.projectKey=raulgdias_raiz-store
sonar.projectName=RaizStore

# Este é um monorepo: analisamos apenas os fontes das aplicações e contratos.
sonar.sources=apps/api/src,apps/web/src,packages/contracts/src
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts
sonar.exclusions=**/*.d.ts

# A API usa Jest e produz este relatório no workflow do GitHub Actions.
sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info
sonar.sourceEncoding=UTF-8
